[package]
name = "nawa"
version = "5.1.0"
description = "Nawa Arabic productivity and task manager"
authors = ["Atef Fawzy"]
edition = "2021"

[lib]
name = "nawa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
tauri-plugin-notification = "2.6.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"

<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>نَواة</title>
    <meta name="description" content="نَواة — مدير مهام سريع بيشتغل أوفلاين: إضافة سريعة بالعربي، تركيز بومودورو، إحصائيات وتتبع للعادات." />
    <meta name="theme-color" content="#7668e8" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="نَواة" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <link rel="alternate icon" href="%BASE_URL%favicon.ico" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        pointer-events: none;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 30%, #9a8fff, #6555d8 55%, #4a3bb8 100%);
        color: #fff;
        font:
          800 1.7rem/1 system-ui,
          sans-serif;
        transition:
          opacity 0.5s ease,
          visibility 0.5s;
      }
      #splash.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #splash img {
        width: 104px;
        height: 104px;
        border-radius: 26px;
        box-shadow: 0 18px 60px rgba(139, 108, 255, 0.45);
        animation: splash-rise 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #splash p {
        margin: 0;
        animation: splash-fade 1s 0.2s both;
      }
      #splash small {
        font:
          500 0.85rem/1 system-ui,
          sans-serif;
        opacity: 0.7;
        animation: splash-fade 1s 0.45s both;
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.9);
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash p,
        #splash small {
          animation: none;
        }
      }
      html[data-theme="light"] body {
        background: #f6f5fb;
      }
      html[data-theme="dark"] body {
        background: #0f0d1a;
      }
    </style>
    <script>
      // Apply saved language/theme before first paint (mirrors state/app.ts + hooks/use-document-settings.ts).
      try {
        var raw = localStorage.getItem("nawa:v3");
        var st = raw ? JSON.parse(raw) : null;
        st = st && st.settings;
        var lang = st ? (st.language === "en" ? "en" : "ar") : /^en/i.test(navigator.language || "") ? "en" : "ar";
        var pref = st && st.theme;
        var light = pref === "light" || (pref !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
        var d = document.documentElement;
        d.lang = lang;
        d.dir = lang === "ar" ? "rtl" : "ltr";
        d.dataset.theme = light ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="%BASE_URL%logo192.png" alt="" width="104" height="104" />
      <p>نَواة</p>
      <small>MAHAMY</small>
    </div>
    <div id="root"></div>
    <noscript>نَواة محتاج JavaScript عشان يشتغل. · Nawa needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
